<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mentorship — MentorBridge</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/pages/directory.css" />
  </head>
  <body>
    <nav class="navbar" id="navbar"></nav>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main-content">
        <div class="page-header animate-fade-in">
          <h1>🤝 Mentorship</h1>
          <p>Manage your mentorship connections and requests</p>
        </div>

        <!-- Stats row -->
        <div
          style="
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
          "
          class="animate-fade-in"
        >
          <div class="stat-card">
            <div class="stat-icon" style="background: rgba(34, 197, 94, 0.12)">✅</div>
            <div>
              <div class="stat-value" id="count-accepted">—</div>
              <div class="stat-label">Active Mentorships</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: rgba(245, 158, 11, 0.12)">⏳</div>
            <div>
              <div class="stat-value" id="count-pending">—</div>
              <div class="stat-label">Pending Requests</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: rgba(108, 99, 255, 0.12)">📋</div>
            <div>
              <div class="stat-value" id="count-all">—</div>
              <div class="stat-label">Total Requests</div>
            </div>
          </div>
        </div>

        <!-- Filter Tabs -->
        <div class="tabs animate-fade-in delay-100" style="margin-bottom: 16px">
          <button class="tab-btn req-tab active" data-status="all">All</button>
          <button class="tab-btn req-tab" data-status="pending">⏳ Pending</button>
          <button class="tab-btn req-tab" data-status="accepted">✅ Accepted</button>
          <button class="tab-btn req-tab" data-status="rejected">❌ Rejected</button>
        </div>

        <div id="requests-container" class="animate-fade-in delay-200">
          <div class="empty-state"><div class="animate-spin" style="font-size: 2rem">⏳</div></div>
        </div>

        <!-- CTA for juniors -->
        <div id="junior-cta" style="display: none; margin-top: 24px" class="animate-fade-in">
          <div class="card card-gradient" style="text-align: center; padding: 32px">
            <div style="font-size: 3rem; margin-bottom: 12px">🔍</div>
            <h3>Looking for a mentor?</h3>
            <p style="margin: 8px 0 20px; color: var(--text-secondary)">
              Browse our senior directory to find the perfect mentor for your goals
            </p>
            <a href="senior-directory.html" class="btn btn-primary">Find Mentors →</a>
          </div>
        </div>
      </main>
    </div>
    <div id="toast-container"></div>
    <script src="js/api.js"></script>
    <script src="js/mentorship.js"></script>
    <script>
      const u = api.getUser();
      if (u?.role === 'junior') document.getElementById('junior-cta').style.display = 'block';
    </script>
  </body>
</html>
