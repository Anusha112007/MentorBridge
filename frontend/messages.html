<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages — MentorBridge</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <style>
      /* ── Chat layout ───────────────────────────────────── */
      .chat-layout {
        display: grid;
        grid-template-columns: 310px 1fr;
        height: calc(100vh - 64px);
        margin-top: 64px;
        overflow: hidden;
        background: var(--bg-base);
      }
      /* Conversations list */
      .chat-sidebar {
        border-right: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--bg-surface);
        backdrop-filter: blur(20px);
      }
      .chat-sidebar-header {
        padding: 20px 20px 12px 20px;
        border-bottom: 1px solid var(--border-subtle);
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: var(--text-primary);
      }
      .chat-sidebar-search {
        padding: 12px 20px;
        border-bottom: 1px solid var(--border-subtle);
      }
      .conv-list {
        flex: 1;
        overflow-y: auto;
        padding: 10px 0;
      }
      .conv-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        margin: 6px 16px;
        cursor: pointer;
        border-radius: 12px;
        border: 1px solid transparent;
        transition: all 0.2s ease;
      }
      .conv-item:hover {
        background: rgba(255, 255, 255, 0.03);
        border-color: var(--border-subtle);
      }
      .conv-item.active {
        background: rgba(108, 99, 255, 0.1) !important;
        border-color: rgba(108, 99, 255, 0.25) !important;
        box-shadow: inset 4px 0 0 0 var(--primary-light);
      }
      .conv-name {
        font-size: 13.5px;
        font-weight: 700;
        color: var(--text-primary);
      }
      .conv-preview {
        font-size: 12px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 170px;
        margin-top: 2px;
      }
      /* Chat window */
      .chat-window {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
        background: var(--bg-base);
      }
      .chat-header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--bg-card);
      }
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg-row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      .msg-row.mine {
        flex-direction: row-reverse;
      }
      .msg-av {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--gradient-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
        flex-shrink: 0;
      }
      .msg-bubble {
        max-width: 65%;
        padding: 10px 14px;
        border-radius: 16px 16px 16px 4px;
        font-size: 13px;
        line-height: 1.6;
        background: var(--bg-elevated);
        border: 1px solid var(--border-subtle);
        color: var(--text-secondary);
      }
      .msg-row.mine .msg-bubble {
        background: linear-gradient(135deg, #6c63ff, #a855f7);
        border-color: transparent;
        color: #fff;
        border-radius: 16px 16px 4px 16px;
      }
      .msg-time {
        font-size: 10px;
        color: var(--text-muted);
        margin-top: 3px;
        text-align: right;
      }
      .chat-input-area {
        padding: 14px 20px;
        border-top: 1px solid var(--border-subtle);
        display: flex;
        gap: 10px;
        background: var(--bg-card);
      }
      .chat-input {
        flex: 1;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 10px 18px;
        font-size: 13px;
        color: var(--text-primary);
        outline: none;
        transition: border-color 0.2s;
      }
      .chat-input:focus {
        border-color: var(--primary);
      }
      .send-btn {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--gradient-primary);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        transition: opacity 0.2s;
        flex-shrink: 0;
      }
      .send-btn:hover {
        opacity: 0.85;
      }
      /* Empty state */
      .chat-empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        padding: 40px;
        text-align: center;
        background: transparent;
      }
      .empty-glow-circle {
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(108, 99, 255, 0.2) 0%,
          rgba(168, 85, 247, 0.05) 75%,
          transparent 100%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary-light);
        border: 1px solid rgba(108, 99, 255, 0.2);
        margin-bottom: 24px;
        box-shadow: 0 0 35px rgba(108, 99, 255, 0.2);
        animation: floatAnimation 4s ease-in-out infinite;
      }
      @keyframes floatAnimation {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }
      .empty-icon-svg {
        filter: drop-shadow(0 0 8px rgba(108, 99, 255, 0.5));
      }
      .empty-title {
        font-size: 18px;
        font-weight: 800;
        color: var(--text-primary);
        margin: 0 0 8px 0;
        letter-spacing: -0.01em;
      }
      .empty-desc {
        font-size: 13.5px;
        color: var(--text-muted);
        max-width: 340px;
        text-align: center;
        line-height: 1.6;
        margin: 0 0 24px 0;
      }
      /* New chat modal */
      .user-option {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border-subtle);
        cursor: pointer;
      }
      .user-option:hover {
        background: rgba(108, 99, 255, 0.05);
        border-radius: 8px;
      }
      @media (max-width: 640px) {
        .chat-layout {
          grid-template-columns: 1fr;
        }
        .chat-sidebar {
          display: none;
        }
        .chat-sidebar.open {
          display: flex;
          position: fixed;
          inset: 64px 0 0 0;
          z-index: 50;
          background: var(--bg-secondary);
        }
      }

      /* â”€â”€ Modern chat additions â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€ */
      .conv-item {
        position: relative;
        border-left: 3px solid transparent;
      }
      .conv-item.active {
        border-left-color: var(--primary-light);
        background: rgba(108, 99, 255, 0.12);
        box-shadow: inset 4px 0 0 0 var(--primary-light);
      }
      /* Chat suggestions chips */
      .quick-reply-wrapper {
        display: flex;
        gap: 8px;
        padding: 10px 20px;
        background: var(--bg-card);
        border-top: 1px solid var(--border-subtle);
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: none;
      }
      .quick-reply-wrapper::-webkit-scrollbar {
        display: none;
      }
      .quick-reply-chip {
        background: var(--bg-elevated);
        border: 1px solid var(--border-subtle);
        color: var(--text-secondary);
        padding: 6px 14px;
        border-radius: 16px;
        font-size: 11.5px;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-block;
      }
      .quick-reply-chip:hover {
        background: rgba(108, 99, 255, 0.12);
        border-color: var(--primary-light);
        color: var(--primary-light);
        transform: translateY(-1px);
      }

      /* Date boundary separators */
      .date-separator {
        display: flex;
        align-items: center;
        text-align: center;
        margin: 18px 0;
        color: var(--text-muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .date-separator::before,
      .date-separator::after {
        content: '';
        flex: 1;
        border-bottom: 1px solid var(--border-subtle);
      }
      .date-separator:not(:empty)::before {
        margin-right: 1em;
      }
      .date-separator:not(:empty)::after {
        margin-left: 1em;
      }

      /* Code block support inside bubbles */
      .msg-code-block {
        background: #1e1e2e;
        border: 1px solid #313244;
        border-radius: 8px;
        margin: 8px 0 4px 0;
        overflow-x: auto;
        padding: 10px;
        font-family: 'Fira Code', 'Courier New', Courier, monospace;
        font-size: 12px;
        color: #cdd6f4;
        position: relative;
        text-align: left;
      }
      .msg-code-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: #11111b;
        margin: -10px -10px 8px -10px;
        padding: 6px 10px;
        font-size: 10.5px;
        border-bottom: 1px solid #313244;
        color: #a6adc8;
        border-top-left-radius: 7px;
        border-top-right-radius: 7px;
      }
      .copy-code-btn {
        background: none;
        border: none;
        color: var(--primary-light);
        cursor: pointer;
        font-size: 11px;
        font-weight: 600;
      }
      .copy-code-btn:hover {
        color: #fff;
      }

      /* Header Shortcut btn */
      .header-profile-btn {
        margin-left: auto;
        font-size: 12px;
        padding: 6px 12px;
        border-radius: 8px;
        background: rgba(108, 99, 255, 0.1);
        border: 1px solid rgba(108, 99, 255, 0.25);
        color: var(--primary-light);
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        text-decoration: none;
      }
      .header-profile-btn:hover {
        background: var(--primary-light);
        color: #fff;
        border-color: transparent;
      }

      /* Sidebar Segmented Tabs styling */
      .sidebar-tabs {
        display: flex;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 12px;
        margin: 10px 16px;
        padding: 4px;
        border: 1px solid var(--border-subtle);
      }
      .sidebar-tab {
        flex: 1;
        background: none;
        border: none;
        padding: 8px 12px;
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 700;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s ease;
        outline: none;
        text-align: center;
      }
      .sidebar-tab:hover {
        color: var(--text-primary);
      }
      .sidebar-tab.active {
        background: var(--gradient-primary);
        color: #fff !important;
        box-shadow: 0 4px 12px rgba(108, 99, 255, 0.25);
      }
    </style>
  </head>
  <body>
    <nav class="navbar" id="navbar"></nav>

    <div class="chat-layout">
      <!-- Conversations sidebar -->
      <div class="chat-sidebar" id="chat-sidebar">
        <div class="chat-sidebar-header">
          ✉️ Messages
          <button
            class="btn btn-primary btn-sm"
            style="float: right; padding: 4px 10px; font-size: 11px"
            id="new-chat-btn"
          >
            + New
          </button>
        </div>

        <!-- Sidebar Tabs -->
        <div class="sidebar-tabs">
          <button id="tab-chats" class="sidebar-tab active">Chats</button>
          <button id="tab-seniors" class="sidebar-tab">Seniors</button>
        </div>

        <div class="chat-sidebar-search">
          <input
            type="text"
            id="conv-search"
            placeholder="Search..."
            style="
              width: 100%;
              background: var(--bg-elevated);
              border: 1px solid var(--border);
              border-radius: 8px;
              padding: 7px 12px;
              font-size: 12px;
              color: var(--text-primary);
              outline: none;
            "
          />
        </div>
        <div class="conv-list" id="conv-list">
          <div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px">
            Loading...
          </div>
        </div>
        <div class="conv-list" id="seniors-list" style="display: none">
          <div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px">
            Loading...
          </div>
        </div>
      </div>

      <!-- Chat window -->
      <div class="chat-window" id="chat-window">
        <div class="chat-empty" id="chat-empty">
          <div style="font-size: 3rem">✉️</div>
          <div style="font-size: 15px; font-weight: 700; color: var(--text-secondary)">
            Select a conversation
          </div>
          <div style="font-size: 13px">or start a new one</div>
          <button class="btn btn-primary btn-sm" style="margin-top: 8px" id="new-chat-btn2">
            + New Chat
          </button>
        </div>
        <div
          id="active-chat"
          style="display: none; flex-direction: column; flex: 1; overflow: hidden"
        >
          <div class="chat-header" id="chat-header"></div>
          <div class="chat-messages" id="chat-messages"></div>

          <div class="chat-input-area">
            <input
              class="chat-input"
              type="text"
              id="msg-input"
              placeholder="Type a message..."
              autocomplete="off"
            />
            <button class="send-btn" id="send-btn">➤</button>
          </div>
        </div>
      </div>
    </div>

    <!-- New Chat Modal -->
    <div class="modal-overlay" id="new-chat-modal">
      <div class="modal" style="max-width: 440px">
        <div class="modal-header">
          <h3>✉️ New Message</h3>
          <button
            class="modal-close"
            onclick="document.getElementById('new-chat-modal').classList.remove('active')"
          >
            ✕
          </button>
        </div>
        <input
          type="text"
          id="user-search-input"
          placeholder="Search by name..."
          style="
            width: 100%;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
            margin-bottom: 12px;
          "
        />
        <div id="user-search-results" style="max-height: 300px; overflow-y: auto"></div>
      </div>
    </div>

    <div id="toast-container"></div>
    <script src="js/api.js"></script>
    <script>
      let activeUserId = null;
      let pollTimer = null;
      let currentUser = null;
      let allConvs = [];
      let seniorsUsers = [];

      document.addEventListener('DOMContentLoaded', async () => {
        currentUser = requireAuth();
        if (!currentUser) return;
        renderNavbar();

        // Set tab label based on role
        const tabSeniors = document.getElementById('tab-seniors');
        if (tabSeniors) {
          tabSeniors.textContent = currentUser.role === 'senior' ? 'Juniors' : 'Seniors';
        }

        // Sidebar Tabs Toggling
        const tabChats = document.getElementById('tab-chats');
        const convList = document.getElementById('conv-list');
        const seniorsList = document.getElementById('seniors-list');
        const searchEl = document.getElementById('conv-search');

        tabChats?.addEventListener('click', () => {
          tabChats.classList.add('active');
          tabSeniors?.classList.remove('active');
          convList.style.display = 'block';
          if (seniorsList) seniorsList.style.display = 'none';
          if (searchEl) {
            searchEl.value = '';
            renderConvList(allConvs);
          }
        });

        tabSeniors?.addEventListener('click', async () => {
          tabSeniors.classList.add('active');
          tabChats?.classList.remove('active');
          convList.style.display = 'none';
          if (seniorsList) {
            seniorsList.style.display = 'block';
            await loadSeniorsTab();
            if (searchEl) {
              searchEl.value = '';
              renderSeniorsList(seniorsUsers);
            }
          }
        });

        loadConversations();

        // New chat buttons
        ['new-chat-btn', 'new-chat-btn2'].forEach((id) => {
          document.getElementById(id)?.addEventListener('click', openNewChatModal);
        });

        // Send message
        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('msg-input').addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });

        // User search in modal
        let userSearchTimer;
        document.getElementById('user-search-input').addEventListener('input', function () {
          clearTimeout(userSearchTimer);
          userSearchTimer = setTimeout(() => searchUsers(this.value), 300);
        });

        // Search in sidebar
        if (searchEl) {
          searchEl.addEventListener('input', function () {
            const q = this.value.toLowerCase();
            const activeTab = document.querySelector('.sidebar-tab.active');
            if (activeTab && activeTab.id === 'tab-seniors') {
              const filtered = seniorsUsers.filter(
                (u) => u.name?.toLowerCase().includes(q) || u.branch?.toLowerCase().includes(q)
              );
              renderSeniorsList(filtered);
            } else {
              const filtered = allConvs.filter((c) => c.otherUser?.name?.toLowerCase().includes(q));
              renderConvList(filtered);
            }
          });
        }

        // Pre-open from URL ?with=userId or ?userId=userId
        const to =
          new URLSearchParams(window.location.search).get('with') ||
          new URLSearchParams(window.location.search).get('userId');
        if (to) openChat(to);
      });

      async function loadConversations() {
        const el = document.getElementById('conv-list');
        try {
          const data = await api.get('/messages/conversations');
          const rawConvs = data.conversations || [];

          if (!rawConvs.length) {
            el.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px">No conversations yet.<br>Start one!</div>`;
            return;
          }

          // Compute 'otherUser' from each conversation message
          const convs = rawConvs.map((c) => {
            const myId = currentUser._id;
            const senderId = c.sender?._id || c.sender;
            const otherUser = String(senderId) === String(myId) ? c.receiver : c.sender;
            return { otherUser, lastMessage: c };
          });

          allConvs = convs;
          renderConvList(convs);
        } catch (e) {
          el.innerHTML = `<div style="padding:20px;text-align:center;color:var(--error);font-size:13px">Failed to load</div>`;
        }
      }

      function renderConvList(convs) {
        document.getElementById('conv-list').innerHTML = convs
          .map(
            (c) => `
    <div class="conv-item ${activeUserId === c.otherUser?._id ? 'active' : ''}" onclick="openChat('${c.otherUser?._id}')">
      ${renderAvatar(c.otherUser, 'avatar-sm')}
      <div style="flex:1;min-width:0">
        <div class="conv-name">${c.otherUser?.name || '—'}</div>
        <div class="conv-preview">${c.lastMessage?.content || 'No messages yet'}</div>
      </div>
    </div>`
          )
          .join('');
      }

      async function loadSeniorsTab() {
        const el = document.getElementById('seniors-list');
        try {
          const isJunior = currentUser.role === 'junior';
          const endpoint = isJunior ? '/users/seniors?limit=50' : '/users?role=junior&limit=50';
          const data = await api.get(endpoint);
          const users = isJunior ? data.seniors || [] : data.users || [];
          seniorsUsers = users;

          renderSeniorsList(users);
        } catch (e) {
          el.innerHTML = `<div style="padding:20px;text-align:center;color:var(--error);font-size:13px">Failed to load list</div>`;
        }
      }

      function renderSeniorsList(usersList) {
        const el = document.getElementById('seniors-list');
        const isJunior = currentUser.role === 'junior';
        if (!usersList.length) {
          el.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px">No ${isJunior ? 'seniors' : 'juniors'} found.</div>`;
          return;
        }

        el.innerHTML = usersList
          .map(
            (u) => `
      <div class="conv-item ${activeUserId === u._id ? 'active' : ''}" onclick="startChat('${u._id}')">
        ${renderAvatar(u, 'avatar-sm')}
        <div style="flex:1;min-width:0">
          <div class="conv-name">${u.name}</div>
          <div class="conv-preview" style="text-transform:capitalize">${u.branch || ''} · ${u.role}</div>
        </div>
      </div>
    `
          )
          .join('');
      }

      async function openChat(userId) {
        activeUserId = userId;
        clearInterval(pollTimer);

        // Update active item highlights across tabs
        document.querySelectorAll('.conv-item').forEach((item) => {
          const onClickAttr = item.getAttribute('onclick');
          if (
            onClickAttr &&
            (onClickAttr.includes(`openChat('${userId}')`) ||
              onClickAttr.includes(`startChat('${userId}')`) ||
              onClickAttr.includes(`'${userId}'`))
          ) {
            item.classList.add('active');
          } else {
            item.classList.remove('active');
          }
        });

        // Show chat window
        document.getElementById('chat-empty').style.display = 'none';
        const activeChat = document.getElementById('active-chat');
        activeChat.style.display = 'flex';

        // Load user info for header
        try {
          const udata = await api.get(`/users/${userId}`);
          const u = udata.user;
          document.getElementById('chat-header').innerHTML = `
      ${renderAvatar(u, 'avatar-sm')}
      <div style="flex:1; min-width:0;">
        <div style="font-size:14px;font-weight:700">${u.name}</div>
        <div style="font-size:11px;color:var(--text-muted);text-transform:capitalize">${u.role} · ${u.branch || ''}</div>
      </div>`;
        } catch (e) {
          document.getElementById('chat-header').innerHTML =
            `<div style="font-size:14px;font-weight:700">Chat</div>`;
        }

        await loadMessages();
        // Poll every 5s
        pollTimer = setInterval(loadMessages, 5000);
        document.getElementById('msg-input').focus();
      }

      function formatMessageContent(content) {
        let escaped = escapeHtml(content);
        const regex = /```(?:[a-zA-Z0-9+#-]+)?\n([\s\S]*?)```/g;

        escaped = escaped.replace(regex, (match, code) => {
          const buttonId = 'btn-' + Math.random().toString(36).substring(2, 9);
          const cleanCode = code.trim();
          const base64Code = btoa(unescape(encodeURIComponent(cleanCode)));

          return `
            <div class="msg-code-block">
              <div class="msg-code-header">
                <span>💻 Code Snippet</span>
                <button class="copy-code-btn" id="${buttonId}" onclick="copyCodeSnippet('${base64Code}', '${buttonId}')">📋 Copy</button>
              </div>
              <code>${cleanCode}</code>
            </div>
          `;
        });

        escaped = escaped.replace(
          /`([^`]+)`/g,
          '<code style="background:var(--bg-elevated); padding:2px 6px; border-radius:4px; font-family:monospace; font-size:90%; color:var(--primary-light);">$1</code>'
        );
        return escaped;
      }

      window.copyCodeSnippet = function (base64Code, btnId) {
        try {
          const code = decodeURIComponent(escape(atob(base64Code)));
          navigator.clipboard.writeText(code).then(() => {
            const btn = document.getElementById(btnId);
            if (btn) {
              btn.textContent = '✅ Copied!';
              setTimeout(() => {
                btn.textContent = '📋 Copy';
              }, 2000);
            }
          });
        } catch (err) {
          console.error('Failed to copy code snippet', err);
        }
      };

      function getMessageDateString(createdAt) {
        const date = new Date(createdAt);
        const today = new Date();
        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);

        if (date.toDateString() === today.toDateString()) {
          return 'Today';
        } else if (date.toDateString() === yesterday.toDateString()) {
          return 'Yesterday';
        } else {
          return date.toLocaleDateString(undefined, {
            weekday: 'long',
            year: 'numeric',
            month: 'long',
            day: 'numeric',
          });
        }
      }

      async function loadMessages() {
        if (!activeUserId) return;
        try {
          const data = await api.get(`/messages/${activeUserId}`);
          const msgs = data.messages || [];
          const el = document.getElementById('chat-messages');
          const wasAtBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;

          let lastDateStr = null;
          let messagesHtml = '';

          msgs.forEach((m) => {
            const dateStr = getMessageDateString(m.createdAt);
            if (dateStr !== lastDateStr) {
              messagesHtml += `<div class="date-separator">${dateStr}</div>`;
              lastDateStr = dateStr;
            }

            const mine = m.sender?._id === currentUser._id || m.sender === currentUser._id;
            const timeStr = new Date(m.createdAt).toLocaleTimeString(undefined, {
              hour: '2-digit',
              minute: '2-digit',
            });

            messagesHtml += `
              <div class="msg-row ${mine ? 'mine' : ''}">
                ${!mine ? `<div class="msg-av">${getInitials(m.sender?.name)}</div>` : ''}
                <div style="max-width: 65%;">
                  <div class="msg-bubble">${formatMessageContent(m.content)}</div>
                  <div class="msg-time" style="margin-top: 3px; font-size: 10px; color: var(--text-muted); text-align: ${mine ? 'right' : 'left'}">${timeStr}</div>
                </div>
              </div>`;
          });

          el.innerHTML =
            messagesHtml ||
            '<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:20px">Say hello! 👋</div>';

          if (wasAtBottom || msgs.length <= 10) el.scrollTop = el.scrollHeight;
        } catch (e) {}
      }

      async function sendMessage() {
        const input = document.getElementById('msg-input');
        const content = input.value.trim();
        if (!content || !activeUserId) return;
        input.value = '';
        try {
          await api.post(`/messages/${activeUserId}`, { content });
          await loadMessages();
          loadConversations();
        } catch (err) {
          showToast('error', 'Failed to send', err.message);
          input.value = content;
        }
      }

      function openNewChatModal() {
        document.getElementById('new-chat-modal').classList.add('active');
        document.getElementById('user-search-input').value = '';
        searchUsers('');
        setTimeout(() => document.getElementById('user-search-input').focus(), 100);
      }

      async function searchUsers(q) {
        const el = document.getElementById('user-search-results');
        el.innerHTML =
          '<div style="color:var(--text-muted);font-size:13px;padding:8px">Loading...</div>';
        try {
          let url = `/users?limit=10`;
          if (q) {
            url += `&search=${encodeURIComponent(q)}`;
          } else if (currentUser && currentUser.role === 'junior') {
            url += `&role=senior`;
          } else if (currentUser && currentUser.role === 'senior') {
            url += `&role=junior`;
          }
          const data = await api.get(url);
          const users = (data.users || []).filter((u) => u._id !== currentUser._id);
          if (!users.length) {
            el.innerHTML =
              '<div style="color:var(--text-muted);font-size:13px;padding:8px">No users found</div>';
            return;
          }
          el.innerHTML = users
            .map(
              (u) => `
      <div class="user-option" onclick="startChat('${u._id}')">
        ${renderAvatar(u, 'avatar-sm')}
        <div>
          <div style="font-size:13px;font-weight:600">${u.name}</div>
          <div style="font-size:11px;color:var(--text-muted);text-transform:capitalize">${u.role} · ${u.branch || ''}</div>
        </div>
      </div>`
            )
            .join('');
        } catch (e) {
          el.innerHTML =
            '<div style="color:var(--error);font-size:13px;padding:8px">Error loading users</div>';
        }
      }

      function startChat(userId) {
        document.getElementById('new-chat-modal').classList.remove('active');
        openChat(userId);
      }
      window.startChat = startChat;

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      document.getElementById('new-chat-modal')?.addEventListener('click', function (e) {
        if (e.target === this) this.classList.remove('active');
      });
    </script>
  </body>
</html>
