<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages — MentorBridge</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <style>
      /* ── Chat layout ───────────────────────────────────── */
      .chat-layout {
        display: grid;
        grid-template-columns: 280px 1fr;
        height: calc(100vh - 64px);
        overflow: hidden;
      }
      /* Conversations list */
      .chat-sidebar {
        border-right: 1px solid var(--border-subtle);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .chat-sidebar-header {
        padding: 16px;
        border-bottom: 1px solid var(--border-subtle);
        font-size: 14px;
        font-weight: 700;
      }
      .chat-sidebar-search {
        padding: 10px 16px;
        border-bottom: 1px solid var(--border-subtle);
      }
      .conv-list {
        flex: 1;
        overflow-y: auto;
      }
      .conv-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        cursor: pointer;
        border-bottom: 1px solid var(--border-subtle);
        transition: background 0.15s;
      }
      .conv-item:hover,
      .conv-item.active {
        background: rgba(108, 99, 255, 0.08);
      }
      .conv-name {
        font-size: 13px;
        font-weight: 600;
      }
      .conv-preview {
        font-size: 12px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 160px;
      }
      /* Chat window */
      .chat-window {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .chat-header {
        padding: 14px 20px;
        border-bottom: 1px solid var(--border-subtle);
        display: flex;
        align-items: center;
        gap: 12px;
        background: var(--bg-card);
      }
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg-row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      .msg-row.mine {
        flex-direction: row-reverse;
      }
      .msg-av {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: var(--gradient-primary);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        color: #fff;
        flex-shrink: 0;
      }
      .msg-bubble {
        max-width: 65%;
        padding: 10px 14px;
        border-radius: 16px 16px 16px 4px;
        font-size: 13px;
        line-height: 1.6;
        background: var(--bg-elevated);
        border: 1px solid var(--border-subtle);
        color: var(--text-secondary);
      }
      .msg-row.mine .msg-bubble {
        background: linear-gradient(135deg, #6c63ff, #a855f7);
        border-color: transparent;
        color: #fff;
        border-radius: 16px 16px 4px 16px;
      }
      .msg-time {
        font-size: 10px;
        color: var(--text-muted);
        margin-top: 3px;
        text-align: right;
      }
      .chat-input-area {
        padding: 14px 20px;
        border-top: 1px solid var(--border-subtle);
        display: flex;
        gap: 10px;
        background: var(--bg-card);
      }
      .chat-input {
        flex: 1;
        background: var(--bg-elevated);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 10px 18px;
        font-size: 13px;
        color: var(--text-primary);
        outline: none;
        transition: border-color 0.2s;
      }
      .chat-input:focus {
        border-color: var(--primary);
      }
      .send-btn {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--gradient-primary);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        transition: opacity 0.2s;
        flex-shrink: 0;
      }
      .send-btn:hover {
        opacity: 0.85;
      }
      /* Empty state */
      .chat-empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        gap: 10px;
      }
      /* New chat modal */
      .user-option {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border-subtle);
        cursor: pointer;
      }
      .user-option:hover {
        background: rgba(108, 99, 255, 0.05);
        border-radius: 8px;
      }
      @media (max-width: 640px) {
        .chat-layout {
          grid-template-columns: 1fr;
        }
        .chat-sidebar {
          display: none;
        }
        .chat-sidebar.open {
          display: flex;
          position: fixed;
          inset: 64px 0 0 0;
          z-index: 50;
          background: var(--bg-secondary);
        }
      }
    </style>
  </head>
  <body>
    <nav class="navbar" id="navbar"></nav>

    <div class="chat-layout">
      <!-- Conversations sidebar -->
      <div class="chat-sidebar" id="chat-sidebar">
        <div class="chat-sidebar-header">
          ✉️ Messages
          <button
            class="btn btn-primary btn-sm"
            style="float: right; padding: 4px 10px; font-size: 11px"
            id="new-chat-btn"
          >
            + New
          </button>
        </div>

        <!-- Sidebar Tabs -->
        <div
          class="sidebar-tabs"
          style="display: flex; border-bottom: 1px solid var(--border-subtle)"
        >
          <button
            id="tab-chats"
            class="sidebar-tab"
            style="
              flex: 1;
              background: none;
              border: none;
              padding: 10px;
              color: var(--text-primary);
              border-bottom: 2px solid var(--primary);
              font-size: 12px;
              font-weight: 600;
              cursor: pointer;
              transition: 0.2s;
              outline: none;
            "
          >
            Chats
          </button>
          <button
            id="tab-seniors"
            class="sidebar-tab"
            style="
              flex: 1;
              background: none;
              border: none;
              padding: 10px;
              color: var(--text-muted);
              border-bottom: 2px solid transparent;
              font-size: 12px;
              font-weight: 600;
              cursor: pointer;
              transition: 0.2s;
              outline: none;
            "
          >
            Seniors
          </button>
        </div>

        <div class="chat-sidebar-search">
          <input
            type="text"
            id="conv-search"
            placeholder="Search..."
            style="
              width: 100%;
              background: var(--bg-elevated);
              border: 1px solid var(--border);
              border-radius: 8px;
              padding: 7px 12px;
              font-size: 12px;
              color: var(--text-primary);
              outline: none;
            "
          />
        </div>
        <div class="conv-list" id="conv-list">
          <div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px">
            Loading...
          </div>
        </div>
        <div class="conv-list" id="seniors-list" style="display: none">
          <div style="padding: 20px; text-align: center; color: var(--text-muted); font-size: 13px">
            Loading...
          </div>
        </div>
      </div>

      <!-- Chat window -->
      <div class="chat-window" id="chat-window">
        <div class="chat-empty" id="chat-empty">
          <div style="font-size: 3rem">✉️</div>
          <div style="font-size: 15px; font-weight: 700; color: var(--text-secondary)">
            Select a conversation
          </div>
          <div style="font-size: 13px">or start a new one</div>
          <button class="btn btn-primary btn-sm" style="margin-top: 8px" id="new-chat-btn2">
            + New Chat
          </button>
        </div>
        <div
          id="active-chat"
          style="display: none; flex-direction: column; flex: 1; overflow: hidden"
        >
          <div class="chat-header" id="chat-header"></div>
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-input-area">
            <input
              class="chat-input"
              type="text"
              id="msg-input"
              placeholder="Type a message..."
              autocomplete="off"
            />
            <button class="send-btn" id="send-btn">➤</button>
          </div>
        </div>
      </div>
    </div>

    <!-- New Chat Modal -->
    <div class="modal-overlay" id="new-chat-modal">
      <div class="modal" style="max-width: 440px">
        <div class="modal-header">
          <h3>✉️ New Message</h3>
          <button
            class="modal-close"
            onclick="document.getElementById('new-chat-modal').classList.remove('active')"
          >
            ✕
          </button>
        </div>
        <input
          type="text"
          id="user-search-input"
          placeholder="Search by name..."
          style="
            width: 100%;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
            margin-bottom: 12px;
          "
        />
        <div id="user-search-results" style="max-height: 300px; overflow-y: auto"></div>
      </div>
    </div>

    <div id="toast-container"></div>
    <script src="js/api.js"></script>
    <script>
      let activeUserId = null;
      let pollTimer = null;
      let currentUser = null;

      document.addEventListener('DOMContentLoaded', async () => {
        currentUser = requireAuth();
        if (!currentUser) return;
        renderNavbar();

        // Set tab label based on role
        const tabSeniors = document.getElementById('tab-seniors');
        if (tabSeniors) {
          tabSeniors.textContent = currentUser.role === 'senior' ? 'Juniors' : 'Seniors';
        }

        // Sidebar Tabs Toggling
        const tabChats = document.getElementById('tab-chats');
        const convList = document.getElementById('conv-list');
        const seniorsList = document.getElementById('seniors-list');

        tabChats?.addEventListener('click', () => {
          tabChats.style.color = 'var(--text-primary)';
          tabChats.style.borderBottomColor = 'var(--primary)';
          if (tabSeniors) {
            tabSeniors.style.color = 'var(--text-muted)';
            tabSeniors.style.borderBottomColor = 'transparent';
          }
          convList.style.display = 'block';
          if (seniorsList) seniorsList.style.display = 'none';
        });

        tabSeniors?.addEventListener('click', async () => {
          tabSeniors.style.color = 'var(--text-primary)';
          tabSeniors.style.borderBottomColor = 'var(--primary)';
          if (tabChats) {
            tabChats.style.color = 'var(--text-muted)';
            tabChats.style.borderBottomColor = 'transparent';
          }
          convList.style.display = 'none';
          if (seniorsList) {
            seniorsList.style.display = 'block';
            await loadSeniorsTab();
          }
        });

        loadConversations();

        // New chat buttons
        ['new-chat-btn', 'new-chat-btn2'].forEach((id) => {
          document.getElementById(id)?.addEventListener('click', openNewChatModal);
        });

        // Send message
        document.getElementById('send-btn').addEventListener('click', sendMessage);
        document.getElementById('msg-input').addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });

        // User search in modal
        let userSearchTimer;
        document.getElementById('user-search-input').addEventListener('input', function () {
          clearTimeout(userSearchTimer);
          userSearchTimer = setTimeout(() => searchUsers(this.value), 300);
        });

        // Pre-open from URL ?with=userId or ?userId=userId
        const to =
          new URLSearchParams(window.location.search).get('with') ||
          new URLSearchParams(window.location.search).get('userId');
        if (to) openChat(to);
      });

      async function loadConversations() {
        const el = document.getElementById('conv-list');
        try {
          const data = await api.get('/messages/conversations');
          const rawConvs = data.conversations || [];

          if (!rawConvs.length) {
            el.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px">No conversations yet.<br>Start one!</div>`;
            return;
          }

          // Compute 'otherUser' from each conversation message
          const convs = rawConvs.map((c) => {
            const myId = currentUser._id;
            const senderId = c.sender?._id || c.sender;
            const otherUser = String(senderId) === String(myId) ? c.receiver : c.sender;
            return { otherUser, lastMessage: c };
          });

          renderConvList(convs);

          // Search handler (attach only once)
          const searchEl = document.getElementById('conv-search');
          if (searchEl && !searchEl._attached) {
            searchEl._attached = true;
            searchEl.addEventListener('input', function () {
              const q = this.value.toLowerCase();
              renderConvList(convs.filter((c) => c.otherUser?.name?.toLowerCase().includes(q)));
            });
          }
        } catch (e) {
          el.innerHTML = `<div style="padding:20px;text-align:center;color:var(--error);font-size:13px">Failed to load</div>`;
        }
      }

      function renderConvList(convs) {
        document.getElementById('conv-list').innerHTML = convs
          .map(
            (c) => `
    <div class="conv-item ${activeUserId === c.otherUser?._id ? 'active' : ''}" onclick="openChat('${c.otherUser?._id}')">
      ${renderAvatar(c.otherUser, 'avatar-sm')}
      <div style="flex:1;min-width:0">
        <div class="conv-name">${c.otherUser?.name || '—'}</div>
        <div class="conv-preview">${c.lastMessage?.content || 'No messages yet'}</div>
      </div>
    </div>`
          )
          .join('');
      }

      async function loadSeniorsTab() {
        const el = document.getElementById('seniors-list');
        try {
          const isJunior = currentUser.role === 'junior';
          const endpoint = isJunior ? '/users/seniors?limit=50' : '/users?role=junior&limit=50';
          const data = await api.get(endpoint);
          const users = isJunior ? data.seniors || [] : data.users || [];

          if (!users.length) {
            el.innerHTML = `<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:13px">No ${isJunior ? 'seniors' : 'juniors'} found.</div>`;
            return;
          }

          el.innerHTML = users
            .map(
              (u) => `
      <div class="conv-item ${activeUserId === u._id ? 'active' : ''}" onclick="startChat('${u._id}')">
        ${renderAvatar(u, 'avatar-sm')}
        <div style="flex:1;min-width:0">
          <div class="conv-name">${u.name}</div>
          <div class="conv-preview" style="text-transform:capitalize">${u.branch || ''} · ${u.role}</div>
        </div>
      </div>
    `
            )
            .join('');
        } catch (e) {
          el.innerHTML = `<div style="padding:20px;text-align:center;color:var(--error);font-size:13px">Failed to load list</div>`;
        }
      }

      async function openChat(userId) {
        activeUserId = userId;
        clearInterval(pollTimer);

        // Update active item highlights across tabs
        document.querySelectorAll('.conv-item').forEach((item) => {
          const onClickAttr = item.getAttribute('onclick');
          if (
            onClickAttr &&
            (onClickAttr.includes(`openChat('${userId}')`) ||
              onClickAttr.includes(`startChat('${userId}')`) ||
              onClickAttr.includes(`'${userId}'`))
          ) {
            item.classList.add('active');
          } else {
            item.classList.remove('active');
          }
        });

        // Show chat window
        document.getElementById('chat-empty').style.display = 'none';
        const activeChat = document.getElementById('active-chat');
        activeChat.style.display = 'flex';

        // Load user info for header
        try {
          const udata = await api.get(`/users/${userId}`);
          const u = udata.user;
          document.getElementById('chat-header').innerHTML = `
      ${renderAvatar(u, 'avatar-sm')}
      <div>
        <div style="font-size:14px;font-weight:700">${u.name}</div>
        <div style="font-size:11px;color:var(--text-muted);text-transform:capitalize">${u.role} · ${u.branch || ''}</div>
      </div>`;
        } catch (e) {
          document.getElementById('chat-header').innerHTML =
            `<div style="font-size:14px;font-weight:700">Chat</div>`;
        }

        await loadMessages();
        // Poll every 5s
        pollTimer = setInterval(loadMessages, 5000);
        document.getElementById('msg-input').focus();
      }

      async function loadMessages() {
        if (!activeUserId) return;
        try {
          const data = await api.get(`/messages/${activeUserId}`);
          const msgs = data.messages || [];
          const el = document.getElementById('chat-messages');
          const wasAtBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 60;

          el.innerHTML =
            msgs
              .map((m) => {
                const mine = m.sender?._id === currentUser._id || m.sender === currentUser._id;
                return `
      <div class="msg-row ${mine ? 'mine' : ''}">
        ${!mine ? `<div class="msg-av">${getInitials(m.sender?.name)}</div>` : ''}
        <div>
          <div class="msg-bubble">${escapeHtml(m.content)}</div>
          <div class="msg-time">${timeAgo(m.createdAt)}</div>
        </div>
      </div>`;
              })
              .join('') ||
            '<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:20px">Say hello! 👋</div>';

          if (wasAtBottom || msgs.length <= 10) el.scrollTop = el.scrollHeight;
        } catch (e) {}
      }

      async function sendMessage() {
        const input = document.getElementById('msg-input');
        const content = input.value.trim();
        if (!content || !activeUserId) return;
        input.value = '';
        try {
          await api.post(`/messages/${activeUserId}`, { content });
          await loadMessages();
          loadConversations();
        } catch (err) {
          showToast('error', 'Failed to send', err.message);
          input.value = content;
        }
      }

      function openNewChatModal() {
        document.getElementById('new-chat-modal').classList.add('active');
        document.getElementById('user-search-input').value = '';
        searchUsers('');
        setTimeout(() => document.getElementById('user-search-input').focus(), 100);
      }

      async function searchUsers(q) {
        const el = document.getElementById('user-search-results');
        el.innerHTML =
          '<div style="color:var(--text-muted);font-size:13px;padding:8px">Loading...</div>';
        try {
          let url = `/users?limit=10`;
          if (q) {
            url += `&search=${encodeURIComponent(q)}`;
          } else if (currentUser && currentUser.role === 'junior') {
            url += `&role=senior`;
          } else if (currentUser && currentUser.role === 'senior') {
            url += `&role=junior`;
          }
          const data = await api.get(url);
          const users = (data.users || []).filter((u) => u._id !== currentUser._id);
          if (!users.length) {
            el.innerHTML =
              '<div style="color:var(--text-muted);font-size:13px;padding:8px">No users found</div>';
            return;
          }
          el.innerHTML = users
            .map(
              (u) => `
      <div class="user-option" onclick="startChat('${u._id}')">
        ${renderAvatar(u, 'avatar-sm')}
        <div>
          <div style="font-size:13px;font-weight:600">${u.name}</div>
          <div style="font-size:11px;color:var(--text-muted);text-transform:capitalize">${u.role} · ${u.branch || ''}</div>
        </div>
      </div>`
            )
            .join('');
        } catch (e) {
          el.innerHTML =
            '<div style="color:var(--error);font-size:13px;padding:8px">Error loading users</div>';
        }
      }

      function startChat(userId) {
        document.getElementById('new-chat-modal').classList.remove('active');
        openChat(userId);
      }
      window.startChat = startChat;

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      document.getElementById('new-chat-modal')?.addEventListener('click', function (e) {
        if (e.target === this) this.classList.remove('active');
      });
    </script>
  </body>
</html>
