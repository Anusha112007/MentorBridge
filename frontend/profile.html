<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile — MentorBridge</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/pages/directory.css" />
  </head>
  <body>
    <nav class="navbar" id="navbar"></nav>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main-content">
        <div class="page-breadcrumb animate-fade-in">
          <a href="javascript:history.back()">← Back</a>
        </div>
        <div id="profile-container" class="animate-fade-in">
          <div style="display: flex; flex-direction: column; gap: 16px">
            <div class="card">
              <div
                class="skeleton skeleton-avatar"
                style="width: 100px; height: 100px; border-radius: 16px; margin-bottom: 16px"
              ></div>
              <div class="skeleton skeleton-title" style="margin-bottom: 8px"></div>
              <div class="skeleton skeleton-text" style="width: 60%"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <div id="toast-container"></div>
    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
