<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — MentorBridge</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/pages/dashboard.css" />
    <style>
      .gamified-tip-card {
        background: radial-gradient(
          circle at top left,
          rgba(99, 102, 241, 0.15) 0%,
          rgba(168, 85, 247, 0.1) 100%
        );
        border: 1px solid rgba(168, 85, 247, 0.25) !important;
        position: relative;
        overflow: hidden;
        margin-top: 20px;
        transition:
          transform 0.2s,
          border-color 0.2s;
      }
      .gamified-tip-card:hover {
        border-color: rgba(168, 85, 247, 0.45) !important;
        transform: translateY(-2px);
      }
      .active-glow {
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.15),
          0 0 20px rgba(168, 85, 247, 0.1);
      }
    </style>
  </head>
  <body>
    <nav class="navbar" id="navbar"></nav>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main-content">
        <!-- Welcome -->
        <div class="welcome-banner animate-fade-in">
          <div class="welcome-text">
            <h2>Hi, <span id="user-name">there</span> 👋</h2>
            <p id="welcome-sub">What do you want to do today?</p>
          </div>
          <div class="welcome-emoji">🎓</div>
        </div>

        <!-- 3 action cards -->
        <div
          style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 24px"
          class="animate-fade-in delay-100"
        >
          <a
            href="doubts.html"
            class="card"
            style="
              text-align: center;
              padding: 32px 20px;
              text-decoration: none;
              transition: transform 0.2s;
            "
            onmouseover="this.style.transform = 'translateY(-4px)'"
            onmouseout="this.style.transform = ''"
          >
            <div style="font-size: 2.5rem; margin-bottom: 12px">❓</div>
            <div
              style="
                font-size: 15px;
                font-weight: 700;
                color: var(--text-primary);
                margin-bottom: 6px;
              "
            >
              Doubts
            </div>
            <div style="font-size: 12px; color: var(--text-muted)">Ask or answer questions</div>
          </a>

          <a
            href="resources.html"
            class="card"
            style="
              text-align: center;
              padding: 32px 20px;
              text-decoration: none;
              transition: transform 0.2s;
            "
            onmouseover="this.style.transform = 'translateY(-4px)'"
            onmouseout="this.style.transform = ''"
          >
            <div style="font-size: 2.5rem; margin-bottom: 12px">📚</div>
            <div
              style="
                font-size: 15px;
                font-weight: 700;
                color: var(--text-primary);
                margin-bottom: 6px;
              "
            >
              Resources
            </div>
            <div style="font-size: 12px; color: var(--text-muted)">Notes, PDFs, links</div>
          </a>

          <a
            href="messages.html"
            class="card"
            style="
              text-align: center;
              padding: 32px 20px;
              text-decoration: none;
              transition: transform 0.2s;
            "
            onmouseover="this.style.transform = 'translateY(-4px)'"
            onmouseout="this.style.transform = ''"
          >
            <div style="font-size: 2.5rem; margin-bottom: 12px">✉️</div>
            <div
              style="
                font-size: 15px;
                font-weight: 700;
                color: var(--text-primary);
                margin-bottom: 6px;
              "
            >
              Messages
            </div>
            <div style="font-size: 12px; color: var(--text-muted)">Chat with seniors/juniors</div>
          </a>
        </div>

        <!-- Gamified Tech Tip Widget -->
        <div
          id="tech-tip-widget"
          class="card gamified-tip-card active-glow animate-fade-in delay-150"
          style="padding: 20px"
        >
          <!-- Header Row -->
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: space-between;
              width: 100%;
              border-bottom: 1px solid rgba(255, 255, 255, 0.08);
              padding-bottom: 12px;
              margin-bottom: 12px;
            "
          >
            <div style="display: flex; align-items: center; gap: 8px">
              <span style="font-size: 1.2rem">💡</span>
              <span
                style="
                  font-size: 12px;
                  font-weight: 800;
                  color: var(--primary-light);
                  text-transform: uppercase;
                  letter-spacing: 0.08em;
                "
              >
                Tech Tip of the Day
              </span>
            </div>
            <div style="display: flex; align-items: center; gap: 8px" id="tip-actions-wrapper">
              <span
                id="streak-badge"
                class="badge badge-warning"
                style="
                  padding: 4px 10px;
                  font-size: 10px;
                  font-weight: 800;
                  border-radius: 12px;
                  border: none;
                "
              >
                🔥 Streak: 0 Days
              </span>
              <button
                id="btn-claim-xp"
                class="btn btn-primary"
                style="
                  padding: 4px 12px;
                  font-size: 10px;
                  border-radius: 12px;
                  font-weight: 800;
                  cursor: pointer;
                  border: none;
                  outline: none;
                  line-height: 1.2;
                "
              >
                💎 Claim +10 XP
              </button>
            </div>
          </div>

          <!-- Content Area -->
          <div style="padding: 4px 0">
            <p
              id="techtip-content"
              style="
                font-size: 13.5px;
                font-weight: 600;
                line-height: 1.6;
                color: var(--text-primary);
                margin: 0;
              "
            >
              Loading daily tech tip...
            </p>
          </div>
        </div>

        <!-- Recent activity -->
        <div
          style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 20px"
          class="animate-fade-in delay-200"
        >
          <!-- Recent doubts -->
          <div class="card">
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 14px;
              "
            >
              <h3 style="font-size: 14px; font-weight: 700">❓ Recent Doubts</h3>
              <a href="doubts.html" class="btn btn-ghost btn-sm">View All</a>
            </div>
            <div id="recent-doubts">
              <div style="color: var(--text-muted); font-size: 13px">Loading...</div>
            </div>
          </div>

          <!-- Recent resources -->
          <div class="card">
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 14px;
              "
            >
              <h3 style="font-size: 14px; font-weight: 700">📚 Recent Resources</h3>
              <a href="resources.html" class="btn btn-ghost btn-sm">View All</a>
            </div>
            <div id="recent-resources">
              <div style="color: var(--text-muted); font-size: 13px">Loading...</div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <div id="toast-container"></div>
    <script src="js/api.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', async () => {
        const user = requireAuth();
        if (!user) return;
        renderNavbar();
        renderSidebar(user.role);
        document.getElementById('user-name').textContent = user.name?.split(' ')[0] || 'there';
        document.getElementById('welcome-sub').textContent =
          user.role === 'senior'
            ? 'Answer doubts, share resources, and guide juniors.'
            : 'Ask doubts, access resources, and chat with seniors.';

        // Recent doubts
        try {
          const d = await api.get('/questions?limit=4');
          const el = document.getElementById('recent-doubts');
          el.innerHTML =
            (d.questions || [])
              .map(
                (q) => `
      <a href="doubts.html?id=${q._id}" style="display:block;padding:8px 0;border-bottom:1px solid var(--border-subtle);text-decoration:none">
        <div style="font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:2px">${q.title?.slice(0, 55)}${q.title?.length > 55 ? '…' : ''}</div>
        <div style="font-size:11px;color:var(--text-muted)">${q.answers?.length || 0} answers · ${timeAgo(q.createdAt)}</div>
      </a>`
              )
              .join('') ||
            '<div style="color:var(--text-muted);font-size:13px">No doubts yet.</div>';
        } catch (e) {}

        // Recent resources
        try {
          const r = await api.get('/resources?limit=4');
          const el = document.getElementById('recent-resources');
          const icons = {
            pdf: '📄',
            notes: '📝',
            'drive-link': '🔗',
            'video-link': '🎬',
            other: '📦',
          };
          el.innerHTML =
            (r.resources || [])
              .map(
                (res) => `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-subtle)">
        <span style="font-size:1.2rem">${icons[res.type] || '📦'}</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${res.title}</div>
        </div>
      </div>`
              )
              .join('') ||
            '<div style="color:var(--text-muted);font-size:13px">No resources yet.</div>';
        } catch (e) {}

        // Tech Tips list
        const TECH_TIPS = [
          "Use `git commit -am 'message'` to stage and commit all modified files in a single command.",
          "In Javascript, use `const user = data || {}` to safely prevent 'Cannot read properties of null' errors.",
          'Write database queries using specific select fields (`SELECT name, email`) instead of `SELECT *` to improve query performance.',
          'In VS Code, press `Ctrl + P` (or `Cmd + P` on Mac) to quickly search for and open any file in your project.',
          'Use CSS custom properties (variables like `--primary-color`) to maintain consistent themes across your components.',
          'Use `console.table()` instead of `console.log()` to print arrays of objects as a clean readable table in your console.',
          'Always add `alt` descriptions to your image tags. It improves accessibility for screen readers and search engine index rankings.',
          'In SQL, use indexes on columns that are frequently used in WHERE, JOIN, or ORDER BY clauses to optimize query speeds.',
          'In Git, use `git checkout -` to quickly switch back to the branch you were previously working on.',
        ];

        try {
          const msPerDay = 24 * 60 * 60 * 1000;
          const epoch = new Date('2026-01-01').getTime();
          const currentDayIndex = Math.floor((Date.now() - epoch) / msPerDay);
          const dailyTip = TECH_TIPS[currentDayIndex % TECH_TIPS.length];

          // Populate the tip content immediately
          document.getElementById('techtip-content').textContent = dailyTip;

          const todayStr = new Date().toISOString().split('T')[0];
          const lastClaimDate = localStorage.getItem('techTipLastClaimDate');
          const savedStreak = parseInt(localStorage.getItem('techTipStreak') || '0', 10);

          const claimBtn = document.getElementById('btn-claim-xp');
          const streakBadge = document.getElementById('streak-badge');

          const updateStreakDisplay = (streak) => {
            streakBadge.textContent = `🔥 Streak: ${streak} ${streak === 1 ? 'Day' : 'Days'}`;
          };

          const setClaimedState = () => {
            if (claimBtn) {
              claimBtn.outerHTML = `<span class="badge badge-success" style="padding: 4px 10px; font-size: 10px; font-weight: 800; border-radius: 12px; border: none; background: var(--success); color: #fff;">✨ +10 XP Claimed</span>`;
            }
          };

          // Setup initial streak display
          updateStreakDisplay(savedStreak);

          // If already claimed today
          if (lastClaimDate === todayStr) {
            setClaimedState();
          }

          claimBtn?.addEventListener('click', () => {
            let newStreak = 1;

            if (lastClaimDate) {
              const yesterday = new Date();
              yesterday.setDate(yesterday.getDate() - 1);
              const yesterdayStr = yesterday.toISOString().split('T')[0];

              if (lastClaimDate === yesterdayStr) {
                newStreak = savedStreak + 1;
              } else if (lastClaimDate === todayStr) {
                newStreak = savedStreak;
              }
            }

            localStorage.setItem('techTipStreak', newStreak);
            localStorage.setItem('techTipLastClaimDate', todayStr);

            updateStreakDisplay(newStreak);
            setClaimedState();
            showToast('success', 'Streak Updated!', '+10 XP Claimed! Keep the streak alive! 🔥');
          });
        } catch (e) {
          console.error('Failed to initialize gamified tech tip', e);
        }
      });
    </script>
  </body>
</html>
