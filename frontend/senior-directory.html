<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Mentors — MentorBridge</title>
    <meta
      name="description"
      content="Search and connect with senior mentors by branch, skills, domain, or company."
    />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/pages/directory.css" />
  </head>
  <body>
    <nav class="navbar" id="navbar"></nav>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main-content">
        <div class="page-header animate-fade-in">
          <h1>🔍 Find Your Mentor</h1>
          <p style="color: var(--text-secondary); margin-top: 6px; max-width: 600px">
            Connect with experienced seniors who can guide you in coding, projects, placements, and
            career preparation.
          </p>
        </div>

        <!-- Prominent Search Bar -->
        <div class="card animate-fade-in" style="margin-bottom: 20px; padding: 16px">
          <div style="display: flex; gap: 12px; align-items: center">
            <div class="search-wrapper" style="flex: 1; margin: 0">
              <span class="search-icon">🔍</span>
              <input
                class="search-input"
                type="text"
                id="search-input"
                placeholder="Search mentors by name or technical skill (e.g. Python, Web Dev, DSA)..."
                style="height: 44px"
              />
            </div>
            <button
              class="btn btn-secondary btn-sm"
              id="clear-filters"
              style="height: 44px; padding: 0 16px; border-radius: 10px"
            >
              ✕ Clear
            </button>
          </div>
        </div>

        <!-- Dynamic scrollable filter pills -->
        <div class="filter-pills-container animate-fade-in delay-100" id="filter-pills">
          <button class="filter-pill active" data-filter="">🔥 All Expertise</button>
          <button class="filter-pill" data-filter="DSA">⚡ DSA</button>
          <button class="filter-pill" data-filter="Web Development">🌐 Web Dev</button>
          <button class="filter-pill" data-filter="AI/ML">🤖 AI/ML</button>
          <button class="filter-pill" data-filter="Data Science">📊 Data Science</button>
          <button class="filter-pill" data-filter="Cybersecurity">🛡️ Cybersecurity</button>
          <button class="filter-pill" data-filter="Cloud Computing">☁️ Cloud Computing</button>
          <button class="filter-pill" data-filter="Competitive Programming">
            🏆 Competitive Prog
          </button>
          <button class="filter-pill" data-filter="Python">🐍 Python</button>
          <button class="filter-pill" data-filter="Java">☕ Java</button>
          <button class="filter-pill" data-filter="Resume Review">📄 Resume Review</button>
          <button class="filter-pill" data-filter="Interview Preparation">💼 Interview Prep</button>
          <button class="filter-pill" data-filter="Aptitude">🧠 Aptitude</button>
        </div>

        <!-- Results header -->
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
          "
          class="animate-fade-in delay-100"
        >
          <p style="color: var(--text-muted); font-size: 13px">
            <span id="total-count">—</span> seniors found
          </p>
        </div>

        <!-- Grid -->
        <div class="senior-grid animate-fade-in delay-200" id="seniors-grid">
          <!-- Populated by JS -->
        </div>
        <div id="pagination"></div>
      </main>
    </div>

    <!-- Detailed Mentor Profile Modal -->
    <div class="modal-overlay" id="mentor-detail-modal">
      <div class="mentor-modal-content">
        <div
          class="modal-header"
          style="border-bottom: none; padding-bottom: 0; margin-bottom: 8px"
        >
          <h3
            style="
              font-size: 12px;
              font-weight: 800;
              text-transform: uppercase;
              color: var(--text-muted);
            "
          >
            Mentor Profile Spotlight
          </h3>
          <button
            class="modal-close"
            onclick="document.getElementById('mentor-detail-modal').classList.remove('active')"
          >
            ✕
          </button>
        </div>
        <div id="mentor-modal-body">
          <!-- Populated dynamically by JS -->
        </div>
      </div>
    </div>

    <div id="toast-container"></div>
    <script src="js/api.js"></script>
    <script src="js/directory.js"></script>
  </body>
</html>
